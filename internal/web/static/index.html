<!doctype html>
<!--
  The run view (OR-67): the card grid rendering /api/snapshot.

  Preact + htm, vendored (OR-66) -- no build step, no bundler. This file and
  js/app.js are what the browser runs; there is nothing to compile between
  editing either and reloading the page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>orion web</title>
    <style>
      :root {
        --ink: #e6e6e6;
        --ink-dim: #9aa0a6;
        --ink-faint: #6b7178;
        --bg: #0b0d10;
        --panel: #12161b;
        --line: #242a33;
        --line-soft: rgba(36, 42, 51, 0.55);
        --ok: #4bb543;
        --fail: #e05252;
        --warn: #d6a231;
        --wait: #4f8ff0;
        --work: #2fb3c4;
        --dimc: #6b7178;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 12px;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 18px;
        height: 44px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .brand { font-weight: 600; font-size: 13px; }
      .brand .dot { color: var(--work); }
      .spacer { flex: 1; }
      .head { padding: 18px 20px 12px; }
      .h1 { font-size: 14px; font-weight: 600; }
      .sub { color: var(--ink-faint); font-size: 11.5px; margin-top: 4px; }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
        padding: 4px 20px 20px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 13px 14px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .card.active { border-color: rgba(47, 179, 196, 0.42); }
      .crow { display: flex; align-items: center; gap: 8px; }
      .key { font-weight: 600; font-size: 12px; letter-spacing: 0.01em; }
      .status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; }
      .status.ok { color: var(--ok); }
      .status.working { color: var(--work); }
      .status.waiting { color: var(--wait); }
      .status.warning { color: var(--warn); }
      .status.failed { color: var(--fail); }
      .summary {
        color: #c8ccd1;
        font-size: 11.5px;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .who { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-dim); }
      .model {
        color: var(--ink-faint);
        font-size: 10.5px;
        padding: 1px 6px;
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .activity { color: var(--ink-faint); font-size: 10.5px; }
      .meta {
        display: flex;
        gap: 14px;
        font-size: 10.5px;
        color: var(--ink-faint);
        border-top: 1px solid var(--line-soft);
        padding-top: 8px;
        margin-top: auto;
      }
      .meta b { font-weight: 600; color: var(--ink-dim); }
      .empty {
        padding: 40px 20px;
        color: var(--ink-faint);
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">orion<span class="dot">&middot;</span>web</div>
      <div class="spacer"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
