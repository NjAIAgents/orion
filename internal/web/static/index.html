<!doctype html>
<!--
  The run view (OR-67): the card grid rendering /api/snapshot.

  Preact + htm, vendored (OR-66) -- no build step, no bundler. This file and
  js/app.js are what the browser runs; there is nothing to compile between
  editing either and reloading the page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>orion web</title>
    <style>
      :root {
        --ink: #e6e6e6;
        --ink-dim: #9aa0a6;
        --ink-faint: #6b7178;
        --bg: #0b0d10;
        --panel: #12161b;
        --line: #242a33;
        --line-soft: rgba(36, 42, 51, 0.55);
        --ok: #4bb543;
        --fail: #e05252;
        --warn: #d6a231;
        --wait: #4f8ff0;
        --work: #2fb3c4;
        --dimc: #6b7178;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 12px;
      }
      .app { display: flex; flex-direction: column; height: 100vh; }
      .topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 18px;
        height: 44px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        flex: none;
      }
      .brand { font-weight: 600; font-size: 13px; }
      .brand .dot { color: var(--work); }
      .nav { display: flex; gap: 2px; }
      .nav .item {
        padding: 5px 11px;
        border-radius: 5px;
        color: var(--ink-faint);
        font-size: 11.5px;
        text-decoration: none;
      }
      .nav .item.on { background: rgba(47, 179, 196, 0.12); color: var(--work); }
      .spacer { flex: 1; }
      .body { display: flex; flex: 1; min-height: 0; }
      .main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; overflow: auto; }
      .head { padding: 18px 20px 12px; flex: none; }
      .h1 { font-size: 14px; font-weight: 600; }
      .sub { color: var(--ink-faint); font-size: 11.5px; margin-top: 4px; }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
        padding: 4px 20px 20px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 13px 14px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .card.active { border-color: rgba(47, 179, 196, 0.42); }
      .crow { display: flex; align-items: center; gap: 8px; }
      .key { font-weight: 600; font-size: 12px; letter-spacing: 0.01em; }
      .status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; }
      .status.ok { color: var(--ok); }
      .status.working { color: var(--work); }
      .status.waiting { color: var(--wait); }
      .status.warning { color: var(--warn); }
      .status.failed { color: var(--fail); }
      .summary {
        color: #c8ccd1;
        font-size: 11.5px;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .who { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-dim); }
      .model {
        color: var(--ink-faint);
        font-size: 10.5px;
        padding: 1px 6px;
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .activity { color: var(--ink-faint); font-size: 10.5px; }
      .meta {
        display: flex;
        gap: 14px;
        font-size: 10.5px;
        color: var(--ink-faint);
        border-top: 1px solid var(--line-soft);
        padding-top: 8px;
        margin-top: auto;
      }
      .meta b { font-weight: 600; color: var(--ink-dim); }
      .empty {
        padding: 40px 20px;
        color: var(--ink-faint);
        font-size: 12px;
        text-align: center;
      }
      /* The log panel (OR-69): docked right, matching the mockup 1:1. */
      .log {
        width: 430px;
        flex: none;
        border-left: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .logtop { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
      .logtop .t { font-size: 11.5px; font-weight: 600; }
      .dim { color: var(--ink-faint); }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 4px;
        border: 1px solid var(--line);
        color: var(--ink-dim);
        font-size: 11px;
      }
      .filter { display: flex; gap: 4px; flex-wrap: wrap; padding: 9px 14px; border-bottom: 1px solid var(--line); }
      .f {
        padding: 2.5px 8px;
        border-radius: 4px;
        border: 1px solid var(--line);
        color: var(--ink-faint);
        font-size: 10.5px;
        cursor: pointer;
        background: none;
        font-family: inherit;
      }
      .f.on { background: rgba(47, 179, 196, 0.13); border-color: rgba(47, 179, 196, 0.35); color: var(--work); }
      .lines { flex: 1; overflow: auto; padding: 10px 0 14px; font-size: 11px; line-height: 1.75; min-height: 0; }
      .ln { display: flex; gap: 8px; padding: 1px 14px; white-space: nowrap; }
      .ts { color: var(--ink-faint); flex: none; width: 58px; }
      .lk { flex: none; width: 52px; overflow: hidden; text-overflow: ellipsis; }
      .lv { flex: none; width: 74px; }
      .lv.ok { color: var(--ok); }
      .lv.working { color: var(--work); }
      .lv.waiting { color: var(--wait); }
      .lv.warning { color: var(--warn); }
      .lv.failed { color: var(--fail); }
      .la { flex: none; width: 150px; overflow: hidden; text-overflow: ellipsis; }
      .lm { flex: none; width: 48px; color: var(--ink-faint); }
      .lg { color: #c8ccd1; overflow: hidden; text-overflow: ellipsis; }
      .stagerow { display: flex; gap: 8px; padding: 4px 14px; white-space: nowrap; align-items: baseline; }
      .rule { color: var(--ink-faint); }
      .stagenames { font-weight: 600; }
      .logfoot {
        border-top: 1px solid var(--line);
        padding: 8px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 10.5px;
        color: var(--ink-faint);
        flex: none;
      }
      .pausebtn {
        margin-left: auto;
        padding: 3px 9px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink-dim);
        cursor: pointer;
        background: none;
        font-family: inherit;
        font-size: inherit;
      }
      .pausebtn.paused { background: rgba(214, 162, 49, 0.13); border-color: rgba(214, 162, 49, 0.35); color: var(--warn); }

      /* The config panel (OR-54, OR-81) and history panel (OR-54, OR-83)
         share this table styling -- one role/run per row, matching the
         mockups' own layout (docs/design/web/04-agents.html). */
      .scroll { flex: 1; overflow: auto; padding: 0 20px 24px; min-height: 0; }
      table { width: 100%; border-collapse: collapse; }
      th {
        text-align: left;
        font-size: 10px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--ink-faint);
        font-weight: 600;
        padding: 0 14px 9px 0;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: var(--bg);
      }
      td { padding: 10px 14px 10px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; font-size: 11.5px; }
      .nm { color: var(--ink); white-space: nowrap; }
      .desig { color: var(--ink-dim); white-space: nowrap; }
      .id { color: var(--ink-faint); font-size: 10.5px; }
      .mdl { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10.5px; }
      .mdl.opus { background: rgba(224, 138, 61, 0.14); color: #e0a06a; }
      .mdl.sonnet { background: rgba(79, 143, 240, 0.13); color: #7bb6f0; }
      .mdl.haiku { background: rgba(75, 181, 67, 0.12); color: #7cc47a; }
      .dash { color: var(--ink-faint); }
      .ovr {
        display: inline-block;
        font-size: 9.5px;
        padding: 1.5px 6px;
        border-radius: 3px;
        background: rgba(214, 162, 49, 0.13);
        color: var(--warn);
        margin-left: 7px;
      }
      .sect {
        font-size: 10.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-faint);
        padding: 22px 0 9px;
        font-weight: 600;
      }
      .why {
        color: var(--ink-faint);
        font-size: 10.5px;
        line-height: 1.6;
        max-width: 430px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
