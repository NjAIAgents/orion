name: release

# Manual only. `make release` is the default path and needs no tokens, so a
# tag-triggered run here would fail on every release for want of secrets that
# deliberately do not exist. A workflow that is always red teaches you to
# ignore CI, which is worse than not having it.
#
# Run this from the Actions tab when you want a clean-machine release, after
# setting RELEASES_GITHUB_TOKEN and TAP_GITHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - run: go vet ./...
      - run: go test ./... -count=1

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }

      - id: v
        name: Resolve version and channel
        env:
          # Through the environment, never interpolated into the script body:
          # `inputs.tag` is free text a dispatcher types, and ${{ }} splices it
          # in before the shell ever sees it.
          TAG: ${{ inputs.tag }}
        run: |
          # THE CHANNEL IS DERIVED FROM THE TAG, and a tag that names no
          # channel stops the run here (OR-255). Nothing else in this file
          # knows what a beta is, so without this step a dispatcher typing
          # v0.9.0-beta.1 would publish a prerelease formula to the Homebrew
          # tap and every stable user's next `brew upgrade` would take it.
          #
          # The shapes come from scripts/tag-channel.sh, which is what
          # scripts/release.sh checks against too. One definition, because two
          # drift and the drift is silent until somebody is running a beta.
          CHANNEL="$(scripts/tag-channel.sh "$TAG")"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          # Tag is vX.Y.Z; brew and scoop want the bare X.Y.Z in the version
          # field, while the download URLs keep the v. Both forms are needed.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "releasing ${TAG} on the ${CHANNEL} channel"

      - run: make dist

      - name: Render brew formula and scoop manifest
        env:
          # Left empty on purpose: the script detects Apache-2.0 from the
          # LICENSE file. Set this repository variable only to override a
          # licence the script cannot identify with certainty.
          ORION_LICENSE: ${{ vars.ORION_LICENSE }}
        run: scripts/render-packaging.sh "${{ steps.v.outputs.version }}"

      # Artifacts go to a PUBLIC repo while the source stays private.
      # Homebrew and Scoop download release assets unauthenticated, so a
      # formula pointing at a private repository 404s for everyone, including
      # the author on a new machine.
      - name: Publish artifacts to the public releases repo
        env:
          TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          CHANNEL: ${{ steps.v.outputs.channel }}
        run: |
          [ -n "$TOKEN" ] || { echo "RELEASES_GITHUB_TOKEN is not set" >&2; exit 1; }
          export GH_TOKEN="$TOKEN"
          # A beta that is not marked prerelease becomes `latest`, and every
          # naive download script that resolves `latest` picks it up -- the
          # same reason scripts/release.sh passes this flag.
          PRERELEASE=""
          [ "$CHANNEL" = "beta" ] && PRERELEASE="--prerelease"
          gh release create "v${VERSION}" \
            --repo NjAIAgents/orion-releases \
            --title "orion v${VERSION}" \
            $PRERELEASE \
            --notes "Binaries for orion v${VERSION}. Source is maintained privately; these archives include LICENSE and NOTICE." \
            dist/orion_* dist/checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: packaging
          path: dist/packaging/

  # Publishing to the tap and the bucket is a separate job on purpose. If it
  # fails, the release itself still exists and is installable by hand; the
  # package managers can be caught up with a re-run rather than a re-tag.
  #
  # PRODUCTION ONLY. A beta never reaches the tap or the bucket: `brew
  # upgrade` would hand a prerelease to a stable user, and semver would keep
  # offering it because v1.2.3-beta.4 sorts below v1.2.3 (OR-255). This is the
  # same rule scripts/release.sh enforces around its publish_manifest calls,
  # stated where this workflow can see it -- the workflow had no beta concept
  # at all and would have published one.
  publish-packages:
    needs: build
    if: needs.build.outputs.channel == 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: packaging, path: packaging }

      - name: Publish Homebrew formula
        env:
          # GITHUB_TOKEN cannot push to another repository. This needs a PAT
          # with contents:write on navjyotnishant/homebrew-tap.
          TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [ -n "$TOKEN" ] || { echo "TAP_GITHUB_TOKEN is not set; skipping tap update" >&2; exit 1; }
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/navjyotnishant/homebrew-tap.git" tap
          cp packaging/orion.rb tap/Formula/orion.rb
          cd tap
          git config user.name  "orion-release"
          git config user.email "orion-release@users.noreply.github.com"
          git add Formula/orion.rb
          git diff --staged --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "orion ${VERSION}"
          git push

      - name: Publish Scoop manifest
        env:
          TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [ -n "$TOKEN" ] || { echo "TAP_GITHUB_TOKEN is not set; skipping bucket update" >&2; exit 1; }
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/navjyotnishant/scoop-bucket.git" bucket
          cp packaging/orion.json bucket/bucket/orion.json
          cd bucket
          git config user.name  "orion-release"
          git config user.email "orion-release@users.noreply.github.com"
          git add bucket/orion.json
          git diff --staged --quiet && { echo "manifest unchanged"; exit 0; }
          git commit -m "orion ${VERSION}"
          git push
