name: ci

on:
  # develop is the integration branch and where work actually lands, so CI
  # must run there too. Triggering only on main meant every commit between
  # releases was unverified by CI.
  #
  # orion/batch is deliberately NOT here. The batch opens a pull request for
  # its ref (OR-253), so `pull_request:` below builds it; listing the ref here
  # as well would match both events and run the batch's single CI run twice,
  # which is the exact cost the batch exists to remove. It was listed here for
  # a few hours on 2026-08-31, when the batch pushed the ref and opened no
  # pull request for it -- the reading side of the same bug.
  push: { branches: [main, develop] }
  # branches-ignore: [main] excludes the develop-to-main PROMOTION pull
  # request, and only that one. Feature pull requests target develop, so
  # they still build here.
  #
  # Without it the promotion built the same tree twice. MEASURED on PR #68
  # (the v0.7.10 promotion) -- both runs carry the same head SHA:
  #
  #   33263756146  push          76419df54  develop
  #   33263758639  pull_request  76419df54  develop
  #
  # The cause is that `push: [develop]` and `pull_request:` BOTH match a
  # pull request whose head branch is develop, which the promotion always
  # is. It is not the concurrency grouping below: those two events land in
  # different groups by construction, so grouping can never merge them into
  # one run (OR-172 claimed otherwise and was wrong; the record is corrected
  # in OR-175).
  #
  # The promotion's required checks stay satisfied because status checks are
  # matched by NAME against the head commit, and the push build already
  # reported all three names on that exact SHA.
  pull_request:
    branches-ignore: [main]

# One run per ref. Without this, a force-push leaves the superseded run
# burning through all three OS legs while its replacement queues behind it --
# and a rebase is a force-push, so every branch that goes stale under
# ci.require_up_to_date pays twice.
#
# Orion SCAFFOLDS this into the workflow it writes for adopted projects and
# did not have it itself, which is how it went unnoticed: the repository that
# generates the good default was the one missing it.
#
# Key on the PR number when there is one, and only fall back to the ref.
# github.ref is refs/heads/<branch> for a push and refs/pull/<n>/merge for a
# pull_request, so grouping on it alone puts the two events in DIFFERENT
# groups and neither cancels the other -- every branch with an open PR built
# twice, worst on the develop-to-main promotion PR whose head branch IS
# develop, which therefore doubled on every release (OR-172).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast ON. It was off so that a macOS-only problem would not hide
      # the Windows result -- sound in principle, and wrong here, because CI
      # has no resume: a failed run is re-run in full, so the surviving legs'
      # results are discarded rather than acted on. They bought a diagnosis
      # nobody used and cost the runner minutes of the slowest leg every time.
      #
      # Measured over 25 runs: 4 failed, and every one had a leg still
      # running when the first went red. That is the waste this removes.
      #
      # It costs nothing on a green run, which is the common case -- there is
      # no leg to cancel. If a platform-specific bug ever does need the full
      # matrix, re-run with fail-fast disabled for that run.
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Windows runs on PROMOTION, not on every pull request.
    #
    # It is the slowest leg by 5-6x -- internal/collect and internal/work
    # spawn git roughly 20x slower there (OR-292) -- and it is the critical
    # path on every run, so every PR waited on it. What it proves is that the
    # code compiles and passes on Windows, and that is worth knowing before
    # a release, not before every review.
    #
    # A push to develop or main still runs it, so nothing reaches a release
    # tag without a Windows verdict. Pull requests gate on Linux and macOS
    # and finish in roughly a third of the time.
    #
    # develop's branch protection must NOT require go (windows-latest) for
    # this to work: a skipped job never reports, and a required check that
    # never reports blocks the merge forever. main keeps requiring it, because
    # a promotion is a push and the leg runs there.
    if: matrix.os != 'windows-latest' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      # 'stable' rather than a pin. Pinning to 1.22 broke the macOS leg:
      # that toolchain links test binaries the current Xcode dyld rejects
      # with "missing LC_UUID load command", which aborts before any test
      # runs. go.mod declares the minimum version; Go is backward compatible,
      # so tracking stable is the safer choice for a solo project than a pin
      # that silently rots against the runner image.
      # setup-go keys its cache on go.sum. This repo has no third-party
      # modules and therefore no go.sum, so the restore failed as a WARNING
      # and GOCACHE was never restored -- every run recompiled the whole tree
      # and all ~40 test binaries cold. Measured on run 33558197328: tests
      # total 48s on every platform; the Windows step took 472s. Pointing the
      # key at go.mod gives it a file that exists.

      - uses: actions/setup-go@v5
        with: 
          go-version: 'stable'
          cache-dependency-path: go.mod

      # git identity: several tests create real repositories and commit into
      # them. A runner has no global identity, so git refuses with "Please
      # tell me who you are" and the failure looks like a broken test rather
      # than a missing environment.
      - name: configure git
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main

      # One script, the same one run by hand, so "it passed locally" and "it
      # passed in CI" mean the same thing. A workflow that inlines its own
      # commands drifts from what a developer runs, and the drift only shows
      # up when a green local run fails on the runner.
      - name: checks
        if: runner.os != 'Windows'
        run: ./scripts/test.sh

      # Windows has no bash script runner by default and the shell quoting
      # differs enough that maintaining a parallel script would reintroduce
      # exactly the drift the shared script exists to prevent. The Windows
      # leg proves the code COMPILES and passes there; the coverage floor and
      # race detector are enforced once, on Linux and macOS.
      - name: checks (windows)
        if: runner.os == 'Windows'
        run: |
          go vet ./...
          go test ./... -count=1
          go build ./cmd/orion
